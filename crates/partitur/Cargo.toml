[package]
name = "partitur"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
partitur-iced.workspace = true
partitur-store.workspace = true
partitur-backend-acp.workspace = true
partitur-core.workspace = true
partitur-git.workspace = true
partitur-mcp.workspace = true
partitur-cef.workspace = true
anyhow.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
# The channel the widget engine reports on.
futures = { workspace = true, features = ["std"] }

[target.'cfg(windows)'.dependencies]
win32job = "2.1.0"
# The message dialog that reports a failed start, as the program has no console there.
rfd.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
futures = { workspace = true, features = ["std", "executor"] }

[package.metadata.deb]
name = "partitur"
maintainer = "mhert <mathias@mh.cx>"
# Debian Policy asks every package to carry a verbatim copy of its license, and without this
# cargo-deb writes a copyright file that names none. The 0 is how many leading lines to skip:
# none, because the file is license text from its very first line.
license-file = ["../../LICENSE", "0"]
section = "devel"
priority = "optional"
extended-description = """\
Partitur is a desktop app for driving AI coding agents. Its main view is a tree of agent \
sessions per project; it talks to Claude Code over the Agent Client Protocol and can split \
work across the repositories of a project."""
# `$auto` is dpkg-shlibdeps, which reads the libraries the binary links: libc, libgcc and
# little else. The window opens its display and graphics libraries with dlopen at run time
# (the Wayland client, xkbcommon, the X11 client libraries, the Vulkan loader), and nothing in
# the ELF names them, so they are listed by hand. Leave one out and the package installs onto a
# machine without it and then fails to open its window. git is what the git port runs.
# Debian and Ubuntu spell every name the same, so one table stays right for both. The libraries
# libcef.so and the bundled node link are found by `$auto` too, which reads every ELF asset, as
# long as the build has them installed: the release job installs them and checks Depends for them.
depends = "$auto, git, libwayland-client0, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libxcursor1, libxi6, libxrandr2, libvulkan1, xdg-utils"
# nodejs and npm run the Claude Code adapter through npx when no Claude Code is installed for the
# bundled one to run; xdg-desktop-portal serves the file dialogs and the light/dark preference.
recommends = "nodejs, npm, xdg-desktop-portal"
# Loads and unloads the AppArmor profile below.
maintainer-scripts = "../../packaging/debian/"
# The release job stages what the binary loads from /usr/lib/partitur under target/deb-stage
# first: CEF's runtime (scripts/cef-runtime.sh) in lib/, the patched adapter
# (scripts/adapter-bundle.sh) in lib/adapter/, and the Node.js it runs on in node/, since the
# adapter needs Node.js 22, newer than Ubuntu 24.04 and Debian 13 ship. CEF's licences go to the
# package's documents. No chrome-sandbox is installed: CEF sandboxes in user namespaces, which
# the AppArmor profile lets it create on Ubuntu.
assets = [
    ["target/release/partitur", "usr/bin/partitur", "755"],
    ["../../target/deb-stage/lib/**/*", "usr/lib/partitur/", "644"],
    ["../../target/deb-stage/node/bin/node", "usr/lib/partitur/adapter/node/bin/node", "755"],
    ["../../target/deb-stage/node/LICENSE", "usr/lib/partitur/adapter/node/LICENSE", "644"],
    ["../../target/deb-stage/CEF-CREDITS.html", "usr/share/doc/partitur/CEF-CREDITS.html", "644"],
    ["../../packaging/debian/apparmor-partitur", "etc/apparmor.d/partitur", "644"],
    ["../../packaging/linux/mhert.partitur.desktop", "usr/share/applications/mhert.partitur.desktop", "644"],
    ["../../packaging/linux/mhert.partitur.svg", "usr/share/icons/hicolor/scalable/apps/mhert.partitur.svg", "644"],
    ["../../packaging/linux/mhert.partitur-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/mhert.partitur-symbolic.svg", "644"],
]
