[package]
name = "partitur-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Exposes the in-memory fakes in `partitur_core::testing` to other crates' tests.
testing = []

[dependencies]
base64.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
# Enables the `testing` feature for this crate's own tests and doctests.
partitur-core = { workspace = true, features = ["testing"] }
