[package]
name = "partitur-cef"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The workspace lints, repeated because a crate cannot inherit them and change one. The only
# difference: `unsafe_code` is `deny` instead of `forbid`, so that the single raw-pointer read of
# CEF's paint buffer in `view.rs` can carry an `#[expect(unsafe_code)]`. Everything else must stay
# in step with the workspace `[workspace.lints]` table.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
missing_errors_doc = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[dependencies]
partitur-core.workspace = true
# The wire protocol the widget engine speaks with Partitur.
partitur-widgets.workspace = true
# The cache folder of a run: a fresh, randomly named folder only the user can enter.
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true

# CEF widgets are not supported on macOS yet (see the crate documentation), so CEF is neither
# fetched nor built there.
[target.'cfg(not(target_os = "macos"))'.dependencies]
cef = { version = "156", default-features = false }

# Moves the protocol off standard output before CEF starts, so that CEF's child processes, which
# inherit standard output, cannot write into it.
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[dev-dependencies]
# The render tests read the host's events.
futures = { workspace = true, features = ["std"] }
# Shows the host's warnings, such as a sandbox fallback, in the render tests' output.
tracing-subscriber.workspace = true

[[test]]
name = "render"
# Every test drives the one helper the binary's own `main` starts, one test after the other.
harness = false
