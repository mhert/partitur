<!doctype html>
<!--
  The sandbox proxy of one widget view, served as partitur-widget://view-<n>/.

  It holds the widget in an iframe sandboxed with allow-scripts and allow-same-origin, as the MCP
  Apps specification asks, and allow-popups, so that a link to a new window and window.open reach
  the host, which never opens the window but hands a link the user clicked to the system's
  browser. Top navigation stays forbidden. The widget's document is served from partitur-app://view-<n>/, an
  origin of its own that is not this page's, so it may use storage and document.cookie but cannot
  reach this page, the host or another view's widget. Messages the widget posts to
  its parent are sent on, in order, as the bodies of POSTs to /bridge. The host delivers its own
  messages by calling window.__partiturDeliver with the JSON text, and they are posted into the
  widget once its document has loaded.
-->
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
iframe { display: block; border: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<iframe id="widget" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
<script>
(function () {
  "use strict";
  var frame = document.getElementById("widget");
  var outbox = [];
  var sending = false;
  var loaded = false;
  var inbox = [];

  function sendNext() {
    if (sending || outbox.length === 0) return;
    sending = true;
    var request = new XMLHttpRequest();
    request.open("POST", "/bridge");
    request.setRequestHeader("Content-Type", "application/json");
    request.onloadend = function () {
      sending = false;
      sendNext();
    };
    request.send(outbox.shift());
  }

  window.addEventListener("message", function (event) {
    if (event.source !== frame.contentWindow) return;
    var text;
    try {
      text = JSON.stringify(event.data);
    } catch (error) {
      return;
    }
    if (typeof text !== "string") return;
    outbox.push(text);
    sendNext();
  });

  function deliver(message) {
    frame.contentWindow.postMessage(message, "*");
  }

  window.__partiturDeliver = function (text) {
    var message;
    try {
      message = JSON.parse(text);
    } catch (error) {
      return;
    }
    if (loaded) deliver(message);
    else inbox.push(message);
  };

  frame.addEventListener("load", function () {
    loaded = true;
    inbox.splice(0).forEach(deliver);
  });

  frame.src = "partitur-app://" + location.host + "/";
}());
</script>
</body>
</html>
