[workspace]
resolver = "3"
members = [
    "crates/partitur",
    "crates/partitur-backend-acp",
    "crates/partitur-core",
    "crates/partitur-git",
    "crates/partitur-iced",
    "crates/partitur-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/mhert/partitur"

[workspace.dependencies]
partitur-core = { path = "crates/partitur-core" }
partitur-store = { path = "crates/partitur-store" }
partitur-git = { path = "crates/partitur-git" }
partitur-backend-acp = { path = "crates/partitur-backend-acp" }
partitur-iced = { path = "crates/partitur-iced" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
toml = "0.9"
directories = "6"
futures = { version = "0.3", default-features = false }
tokio = { version = "1", default-features = false }
tokio-stream = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
agent-client-protocol = { version = "=5.0.0", features = ["process", "unstable_protocol_v2"] }
agent-client-protocol-schema = { version = "=1.15.1", default-features = false }
iced = { version = "0.14", features = ["markdown", "highlighter", "lazy", "image", "svg", "advanced"] }
iced_test = "0.14"
rfd = "0.15"
open = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
missing_errors_doc = "deny"
module_name_repetitions = "allow"   # SessionId in module `session` is fine
must_use_candidate = "allow"        # apply #[must_use] by judgement, not blanket

[profile.dev.package."*"]
# Dependencies such as text shaping (cosmic-text, rustybuzz) run optimised in debug builds; workspace crates stay at opt-level 0.
opt-level = 3
