# cargo-mutants scope: the full mutation gate applies to the crates whose behaviour is decidable
# without a window — partitur-core, partitur-store, partitur-git, partitur-backend-acp,
# partitur-mcp and the partitur binary.
#
# What the excluded crate is gated by instead:
#
# - partitur-iced: the GUI crate is gated by its headless `iced_test` simulator tests, which run
#   inside `cargo test --workspace`, instead of mutation testing.
# - crates/partitur/build.rs: embeds the icon and version info for a Windows target, which the
#   Windows release job proves by building the exe, and sets the Linux rpath to libcef, which
#   every start of the binary outside cargo proves, the smoke included.
# - partitur-cef: the CEF widget host does its work inside a running Chromium, so it is gated by
#   its render tests (`tests/render.rs`, run under xvfb-run in CI) and its unit tests instead.
exclude_globs = ["crates/partitur-iced/**", "crates/partitur/build.rs", "crates/partitur-cef/**"]

# Mutants that survive by design, each pinned to exactly one function with its reason:
#
# - `AcpBackend::shutdown -> ()`: equivalent. `shutdown` only consumes the backend, and Drop
#   performs the same stop and join, so no test can tell the two apart.
# - `main -> ExitCode` (any replacement) and `start -> Ok(())`: the thin binary edge; exercised
#   only by the manual end-to-end run and exempt from coverage for the same reason.
# - `contain` (any replacement): compiled only on Windows; proven by
#   killing_the_launcher_ends_the_whole_tree on the Windows test lane.
# - `|` replaced with `&` or `^` in `own_group`: the expression is compiled only on Windows, so
#   the Linux and macOS runs cannot reach it, and no test can read a process's creation flags
#   on Windows either (`^` is equivalent anyway, the two flags share no bit).
# - `show_error -> ()`: the Windows body opens a modal message dialog that no test can close,
#   and the stub elsewhere does nothing already; proven by a failed start on Windows by hand.
# - the match guard of `widget_host` in `main.rs`: the binary edge where CEF failed to start;
#   the rule itself is `needs_widgets`, tested in `cli.rs`, and the release smoke proves the
#   start where CEF is supported.
# - `MemoryStore::immediate -> Default::default()`: equivalent. An immediate store is the
#   default one; the constructor exists so a test names the mode it relies on.
exclude_re = [
  'runtime\.rs:.*replace AcpBackend::shutdown with \(\)',
  'main\.rs:.*replace main -> ExitCode with ',
  'main\.rs:.*replace start -> anyhow::Result<\(\)> with Ok\(\(\)\)',
  'job_run\.rs:.*replace contain -> ',
  'process\.rs:.*replace \| with [&^] in own_group',
  'main\.rs:.*replace show_error with \(\)',
  'testing\.rs:.*replace MemoryStore::immediate -> Self with Default::default\(\)',
  'main\.rs:.*replace match guard needs_widgets\(.*\) with (true|false) in widget_host',
]
