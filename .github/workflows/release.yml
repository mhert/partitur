name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump (Semantic Versioning)"
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: "Preview the bump and build artifacts without committing, tagging, or releasing (uncheck for a real release)"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write

# A release must never be cut short: cancelling one mid-flight can stop it after
# the bump commit and the tag have been pushed but before any asset was uploaded,
# leaving a published tag with nothing behind it and a draft release nobody
# finishes. A second dispatch therefore queues behind the first rather than
# killing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - id: v
        name: Resolve version and mode
        env:
          EVENT: ${{ github.event_name }}
          DRY: ${{ github.event.inputs.dry_run }}
          BUMP: ${{ github.event.inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          # Re-running a real dispatched release does not resume the one that failed,
          # it mints another: the tag the first attempt pushed is now the floor, so
          # the bump below returns the next version and the whole commit-tag-draft
          # sequence runs again, orphaning the release already published. Refuse
          # instead. A dry run touches nothing, so it stays freely re-runnable.
          # To finish a half-done release: after a failed build job use "Re-run failed
          # jobs", which keeps this job's outputs and uploads with --clobber. This
          # refusal fires only for "Re-run all jobs" or when this job itself failed;
          # if it failed after pushing the tag, delete the remote tag and push it again
          # by hand, which takes the tag-push path below (it checks the tag against the
          # workspace version, creates the draft and builds). Never dispatch a fresh
          # run for that: it creates the next version.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY" = "false" ] && [ "$ATTEMPT" != "1" ]; then
            echo "::error::attempt $ATTEMPT of a real release would create a second version; after a failed build job use Re-run failed jobs, and if prepare failed after pushing the tag, delete the remote tag and push it again by hand; never dispatch a fresh run, it creates the next version"
            exit 1
          fi
          # The bump commit is pushed to the branch the run was dispatched from, so a
          # real release needs a branch; from a tag ref the push would name that tag.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY" = "false" ]; then
            case "$GITHUB_REF" in
              refs/heads/*) ;;
              *) echo "::error::a real release must be dispatched from a branch, not $GITHUB_REF"; exit 1 ;;
            esac
          fi
          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#v}"; is_release=true; ref=""
            # Every artifact is named after the tag, but the binary inside it is built
            # from this checkout, so a tag pushed at a commit whose workspace version
            # differs would ship a 0.2.0 package holding a binary that reports 0.1.0.
            # The smoke would catch that only after every build; refuse it here, before
            # anything is built. Read the field with the same anchored expression
            # scripts/bump-version.sh writes it with, so the two agree on which line is
            # the workspace version.
            committed="$(sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' Cargo.toml | head -n1)"
            if [ "$version" != "$committed" ]; then
              echo "::error::tag v$version was pushed at a commit whose workspace version is $committed; the artifacts would be named for a version their binaries do not report"
              exit 1
            fi
          else
            # Dispatch: bump the selected component from the newest published
            # version, not this checkout's committed version. The floor is the
            # highest vX.Y.Z tag on origin; bumping from it keeps releases moving
            # forward even if the committed version has drifted behind the last
            # release (e.g. after a history rewrite). With no tags the floor is
            # empty and bump-version.sh falls back to the committed version. This
            # edits the working tree (Cargo.toml, Cargo.lock, packaging/arch/PKGBUILD);
            # the commit step below persists it on a real release, and a dry run
            # discards it with the job.
            floor="$(git ls-remote --tags origin 'v*' 2>/dev/null \
              | sed -E 's#.*refs/tags/v##; s#\^\{\}$##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n1 || true)"
            version="$(BUMP_FLOOR="$floor" sh scripts/bump-version.sh "$BUMP")"
            if [ "$DRY" = "false" ]; then is_release=true; ref="v$version"; else is_release=false; ref=""; fi
          fi
          {
            echo "version=$version"
            echo "is_release=$is_release"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
      - name: Commit bump, tag, and draft release
        if: steps.v.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.v.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # On a manual real release, persist the bump and create the tag in THIS run.
          # Pushes made with GITHUB_TOKEN (both the branch push and the tag push) do not
          # trigger any workflow, so this re-runs neither CI nor Release -- nothing here
          # depends on that: every build job runs in this same run and builds the tagged
          # commit.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "::error::tag v$VERSION already exists"; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # The bump was applied to the working tree in the previous step.
            git add Cargo.toml Cargo.lock packaging/arch/PKGBUILD
            git commit -m "chore(release): v$VERSION"
            git push origin "HEAD:$BRANCH"
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          # A release triggered by a tag push can be re-run, and the tag it was named
          # for already exists, so the draft the first attempt created is still there.
          # An unconditional create would die on "already_exists" and leave the
          # operator to delete that draft by hand before retrying.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$VERSION already exists; leaving it as it is"
          else
            # The header goes above the generated notes on every release, signed or not, so the
            # tag-push re-run above, which finds the draft already made, never has to add it.
            gh release create "v$VERSION" --draft --title "v$VERSION" \
              --notes "Windows files are signed under Partitur's [code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy)." \
              --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  # Every Linux build job below puts its artifact through scripts/smoke.sh before it uploads
  # anything. The package jobs install the package and smoke the installed command; the
  # AppImage job installs nothing and runs the file itself. The smoke checks `--version`
  # and opens the window once on X11 (Xvfb) and once on Wayland (weston's headless
  # backend); Xvfb and weston are test-only extras installed by the job.
  #
  # What that proves, and what it does not: the window libraries are dlopened, so the
  # packages list them by hand. Each package job asserts that its built package declares
  # every hand-listed name, and installing the package resolves them. The two smoke runs
  # then prove a window opens on X11 and on Wayland with those installed. They do not
  # prove each entry is needed, nor that the package alone brought it: the job's build
  # packages, Xvfb and weston pull several of the same libraries in themselves, which is
  # why the declared lists are asserted rather than trusted to the smoke.
  #
  # The macOS job puts its bundle through scripts/smoke-macos.sh instead. It verifies the
  # ad-hoc signature, checks `--version`, and starts the bundle's binary with `--smoke` and
  # no terminal on stdin, the way a Finder start has none. That proves the bundle is sealed,
  # the window opens on the runner's real window session, and the login shell's environment
  # is read and used, since the smoke fails unless the log says it came from the shell.
  # The window draws through the software renderer (ICED_BACKEND=tiny-skia), as on Linux.
  # It does not prove the GPU path a user's Mac takes, wgpu over Metal; nor what Gatekeeper
  # shows for a bundle downloaded by a browser and quarantined, which CI cannot reproduce;
  # nor a user's own shell and dotfiles; nor a start on macOS 11 to 14: the runners are
  # macOS 15, so the 11.0 minimum is built for, not run.
  #
  # The Windows job signs the MSI and partitur.exe through SignPath when signing is configured,
  # and checks every signature with scripts/check-signature.ps1: the MSI's, the staged
  # partitur.exe's that goes into the zip, and the installed partitur.exe's, which is the copy the
  # MSI carried. On a release the signer must be SignPath Foundation, trusted and timestamped; on
  # a dry run it must be SignPath's test certificate. It installs its MSI silently with msiexec,
  # as a user's double-click would with its defaults, and checks what the install left: the
  # uninstall entry Settings > Apps reads, carrying the version being released, the three files,
  # and the Start menu shortcut. It puts the installed partitur.exe through
  # scripts/smoke-windows.ps1, which checks `--version` and opens the window once with
  # `--smoke`, and checks `--version` of the zip's copy too. Then it runs msiexec /x and checks
  # that the folder, the entry and the shortcut are gone. That proves the signatures, the
  # installer, the uninstaller and a first frame on the runner's real window session, drawn by
  # the software renderer (ICED_BACKEND=tiny-skia). It does not prove the GPU path a user's PC
  # takes, wgpu over DirectX or Vulkan; nor what SmartScreen shows for a download, which rests on
  # the reputation a release builds up rather than on its signature alone; nor a real session
  # against the adapter with a user's Node install; nor Windows 10 or 11 desktops: the runner is
  # Windows Server 2025.
  #
  # The expected version is passed only on a release: a dry run builds the un-bumped
  # commit, whose binary still reports the version before the bump.

  # Distro-native Debian/Ubuntu packages: each builds in its own distro container so
  # `$auto` resolves against that distro and the hand-listed Depends resolve against
  # that distro's archive when the package is installed there.
  deb:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:24.04", tag: ubuntu24.04 }
          - { image: "debian:13", tag: debian13 }
    container: ${{ matrix.image }}
    env:
      TAG: ${{ matrix.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Build deps
        run: |
          apt-get update
          # ca-certificates: the container has none, so the rustup installer's
          # HTTPS download fails with a curl (77) certificate error otherwise.
          # libxkbcommon-dev and libwayland-dev: what the windowing stack's build
          # scripts look for through pkg-config.
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libxkbcommon-dev libwayland-dev
          # gh is not in the distro repos, and the release upload runs inside this
          # container, so install it from GitHub's apt repository.
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y gh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref || github.sha }}
      - name: Rust and cargo-deb
        run: |
          # The toolchain is the one rust-toolchain.toml pins, so the package is built
          # with the compiler every other lane uses.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          . "$HOME/.cargo/env"
          rustup toolchain install
          # Pinned like every other tool in this workflow: this is the tool that builds
          # the package Debian and Ubuntu users install, so a new version of it must not
          # reach a release without somebody having looked at it first.
          cargo install cargo-deb --version 3.7.0 --locked
      - name: Build + package
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --locked -p partitur
          cargo deb -p partitur --no-build --deb-version "$VERSION"
          # Renamed right after it is built, so the distro tag is in the name before
          # anything else can pick the file up by a glob.
          mv target/debian/partitur_*.deb "partitur_${VERSION}_amd64_${TAG}.deb"
      - name: The package declares every library it loads at run time
        # The window dlopens these, so dpkg-shlibdeps cannot see them and a package
        # without them installs cleanly and then fails to open its window -- the worse
        # failure of the two, because it reaches the user rather than the build. The
        # build packages and the smoke's display servers already pull several of them
        # into this container, so the smoke would pass with one missing; the declared
        # field is checked instead. The list is the hand-written one in
        # crates/partitur/Cargo.toml.
        run: |
          deb="partitur_${VERSION}_amd64_${TAG}.deb"
          dpkg -I "$deb"
          # One name per line, version constraints dropped.
          declared="$(dpkg-deb -f "$deb" Depends | tr ',|' '\n\n' | sed 's/(.*//; s/[[:space:]]//g')"
          missing=0
          for name in git libwayland-client0 libxkbcommon0 libxkbcommon-x11-0 libx11-6 \
            libxcursor1 libxi6 libxrandr2 libvulkan1 xdg-utils; do
            if ! printf '%s\n' "$declared" | grep -qxF "$name"; then
              echo "::error::$deb does not declare $name in Depends"
              missing=1
            fi
          done
          exit "$missing"
      - name: Install the package and smoke it
        env:
          EXPECTED: ${{ needs.prepare.outputs.is_release == 'true' && needs.prepare.outputs.version || '' }}
        # The package goes in by itself first, so a declared name this distro does not
        # have fails its own install rather than hiding behind the extras. Recommends are
        # left out: nodejs and npm are not needed to start, and the portal would pull a
        # session bus stack the smoke does not use.
        run: |
          apt-get install -y --no-install-recommends "./partitur_${VERSION}_amd64_${TAG}.deb"
          apt-get install -y --no-install-recommends xvfb xauth weston
          sh scripts/smoke.sh partitur "$EXPECTED"
      - name: Upload
        if: needs.prepare.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$VERSION" "partitur_${VERSION}_amd64_${TAG}.deb" \
            --repo "${GITHUB_REPOSITORY}" --clobber
      - if: needs.prepare.outputs.is_release != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "deb-${{ matrix.tag }}", path: "partitur_*.deb" }

  # Distro-native Arch package: makepkg only runs on Arch, so this builds in an
  # archlinux container and ships the built package plus the PKGBUILD.
  arch:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: archlinux:latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # The archlinux image ships no git, so actions/checkout would fall back to
      # an API tarball with no .git and the git archive below would fail; install
      # git first so checkout clones a real repository.
      - name: Install git before checkout
        run: pacman -Sy --noconfirm git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref || github.sha }}
      - name: Toolchain
        # rust: the PKGBUILD's makedepends. makepkg runs unprivileged here and cannot
        # install a missing one itself, so it is put in front of it.
        # wayland and libxkbcommon: the windowing stack's build scripts find them through
        # pkg-config; on Arch the headers ship in the library packages themselves.
        # github-cli: the release upload runs inside this container.
        # xorg-server-xvfb and weston: the smoke's virtual display and compositor.
        run: pacman -Syu --noconfirm base-devel git namcap rust wayland libxkbcommon github-cli xorg-server-xvfb weston
      - name: Materialize PKGBUILD for this version
        run: |
          cp packaging/arch/PKGBUILD .
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          git config --global --add safe.directory '*'
          # makepkg uses a same-named local file over the source= URL (checksums
          # skipped below), so the dry run builds without any published tag
          # existing yet.
          git archive --format=tar.gz \
            --prefix="partitur-$VERSION/" \
            -o "partitur-$VERSION.tar.gz" HEAD
          useradd -m builder && chown -R builder .
      - name: makepkg + namcap
        # namcap stays advisory: it reports packaging opinions, not build failures.
        # --nodeps: makepkg would insist every runtime depends is installed before it
        # builds, but most of them are libraries the window only loads at run time.
        # They are left to `pacman -U` below, which resolves them from the package.
        run: |
          sudo -u builder namcap PKGBUILD || true
          sudo -u builder makepkg -f --skipchecksums --nodeps --noconfirm
      - name: The package declares every library it loads at run time
        # The window dlopens these, so nothing at build time notices one missing from
        # the PKGBUILD's depends, and the toolchain step above has already installed
        # several of them (wayland, libxkbcommon, and what Xvfb and weston bring), so
        # the smoke would pass without them too. The declared list is checked instead.
        run: |
          pkg="partitur-$VERSION-1-x86_64.pkg.tar.zst"
          LC_ALL=C pacman -Qip "$pkg"
          # The "Depends On" field, continuation lines included, one name per line with
          # version constraints dropped.
          declared="$(LC_ALL=C pacman -Qip "$pkg" \
            | awk '/^Depends On/ { on = 1; sub(/^[^:]*:/, ""); print; next }
                   on && /^[[:space:]]/ { print; next }
                   { on = 0 }' \
            | tr -s '[:space:]' '\n' | sed 's/[<>=].*//')"
          missing=0
          for name in git wayland libxkbcommon libxkbcommon-x11 libx11 libxcursor libxi \
            libxrandr vulkan-icd-loader xdg-utils; do
            if ! printf '%s\n' "$declared" | grep -qxF "$name"; then
              echo "::error::$pkg does not declare $name in its depends"
              missing=1
            fi
          done
          exit "$missing"
      - name: Install the package and smoke it
        env:
          EXPECTED: ${{ needs.prepare.outputs.is_release == 'true' && needs.prepare.outputs.version || '' }}
        run: |
          pacman -U --noconfirm "./partitur-$VERSION-1-x86_64.pkg.tar.zst"
          sh scripts/smoke.sh partitur "$EXPECTED"
      - name: Upload
        if: needs.prepare.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$VERSION" PKGBUILD --repo "${GITHUB_REPOSITORY}" --clobber
          gh release upload "v$VERSION" "./partitur-$VERSION-1-x86_64.pkg.tar.zst" \
            --repo "${GITHUB_REPOSITORY}" --clobber
      - if: needs.prepare.outputs.is_release != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch
          path: |
            PKGBUILD
            partitur-*-x86_64.pkg.tar.zst

  # The Linux that is neither Debian, Ubuntu nor Arch gets the window as an AppImage.
  # It is built on ubuntu-22.04 where every other Linux lane runs 24.04, and that is
  # the point: an AppImage takes the glibc it was linked against as its floor, so the
  # older runner is what lets the file run on distros the newer one would shut out.
  # The display and graphics libraries the window loads at run time are not bundled:
  # they come from the host, as is usual for AppImages.
  appimage:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref || github.sha }}
      - run: rustup show
      - name: Build deps, the host's display libraries and the smoke's display servers
        # The -dev packages are what the build needs; the run-time libraries are the
        # ones the .deb depends on, standing in for what a user's desktop has; xvfb and
        # weston are the smoke's virtual display and compositor.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev \
            libwayland-client0 libxkbcommon0 libxkbcommon-x11-0 libx11-6 libxcursor1 \
            libxi6 libxrandr2 libvulkan1 \
            xvfb xauth weston
      - run: cargo build --release --locked -p partitur
      - name: Assemble the AppDir from the files the packages install
        # The binary, the desktop entry and the master icon, laid out as an installed
        # system. linuxdeploy reads the entry and the icon from here.
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp target/release/partitur AppDir/usr/bin/partitur
          cp packaging/linux/mhert.partitur.desktop AppDir/usr/share/applications/
          cp packaging/linux/mhert.partitur.svg AppDir/usr/share/icons/hicolor/scalable/apps/
      - name: linuxdeploy bundles the linked libraries and packs the AppImage
        env:
          # linuxdeploy's appimage output takes the file name from this variable; there
          # is no flag.
          OUTPUT: partitur-${{ needs.prepare.outputs.version }}-x86_64.AppImage
        # linuxdeploy publishes rolling `continuous` builds and nothing versioned, so the
        # pin every other tool in this workflow gets is not to be had here; what stands
        # in for it is the smoke below, which starts what it packed rather than
        # trusting that it packed it.
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage \
            --desktop-file AppDir/usr/share/applications/mhert.partitur.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/mhert.partitur.svg
      - name: Smoke the AppImage
        # The runner is not asked to mount anything: told to extract itself and run, the
        # AppImage proves its payload without a working FUSE being part of what is
        # tested.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          EXPECTED: ${{ needs.prepare.outputs.is_release == 'true' && needs.prepare.outputs.version || '' }}
        run: sh scripts/smoke.sh "./partitur-$VERSION-x86_64.AppImage" "$EXPECTED"
      - name: Upload
        if: needs.prepare.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$VERSION" \
            "partitur-$VERSION-x86_64.AppImage" --repo "${GITHUB_REPOSITORY}" --clobber
      - if: needs.prepare.outputs.is_release != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # The glob is anchored to the program's own name: linuxdeploy is an AppImage
        # sitting in this same directory, and a bare *.AppImage would carry the tool
        # out with the artifact.
        with: { name: appimage, path: "partitur-*-x86_64.AppImage" }

  # macOS gets a tarball holding Partitur.app rather than a package: there is no system
  # package manager to install into, and an app bundle is what a user drags into
  # Applications. The window links nothing beyond the system frameworks, so the bundle is
  # the binary, its icon and the Info.plist naming both. One tarball per architecture, each
  # built natively on its own runner.
  macos:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: aarch64 }
          - { os: macos-15-intel, arch: x86_64 }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref || github.sha }}
      - run: rustup show
      - name: Build
        # The deployment target is the LSMinimumSystemVersion the Info.plist declares:
        # without it the binary is built for the runner's own macOS 15, and an older Mac
        # would refuse a bundle that claims to run there.
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --locked -p partitur
      - name: Assemble Partitur.app
        # An app bundle is what macOS takes a window to be: a directory holding the binary,
        # the icon, and the Info.plist naming both, which Finder shows as the one Partitur a
        # user drags into Applications. The committed plist carries 0.0.0 placeholders and
        # plutil writes the version being built over them, which is why they have to be keys
        # already in the file rather than tokens to substitute: -replace has nothing to
        # replace otherwise. plutil -lint then refuses a plist the edit left malformed.
        run: |
          app="stage/Partitur.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/partitur "$app/Contents/MacOS/partitur"
          cp packaging/macos/partitur.icns "$app/Contents/Resources/partitur.icns"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$VERSION" "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
      - name: Sign the bundle ad hoc
        # An ad-hoc signature needs no Apple account and no secrets. It seals the bundle,
        # Info.plist and icon included, so it has to come after the last change to it, and
        # it turns the first open of a download from "Partitur is damaged" into the "Open
        # Anyway" prompt the README walks through.
        run: codesign --force --sign - stage/Partitur.app
      - name: Smoke the signed bundle
        env:
          EXPECTED: ${{ needs.prepare.outputs.is_release == 'true' && needs.prepare.outputs.version || '' }}
        run: sh scripts/smoke-macos.sh stage/Partitur.app "$EXPECTED"
      - name: Tar
        # The licence and the README sit beside the bundle, not inside it, so they are
        # readable without opening the app's contents.
        run: |
          cp LICENSE README.md stage/
          # macOS's bsdtar would otherwise add a ._* AppleDouble entry beside files with
          # extended attributes, which unpack as stray files everywhere but on a Mac.
          COPYFILE_DISABLE=1 tar -czf "partitur-$VERSION-${{ matrix.arch }}-macos.tar.gz" -C stage .
      - name: Upload
        if: needs.prepare.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$VERSION" \
            "partitur-$VERSION-${{ matrix.arch }}-macos.tar.gz" --repo "${GITHUB_REPOSITORY}" --clobber
      - if: needs.prepare.outputs.is_release != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "macos-${{ matrix.arch }}", path: "partitur-*-macos.tar.gz" }

  # Windows gets an MSI installer and a zip of the same three files, for those who would rather
  # not install. The C runtime is linked into partitur.exe, so there is nothing to bundle
  # beside it.
  windows:
    needs: prepare
    runs-on: windows-2025
    # The signing request waits up to an hour for its approval, on top of the build.
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Git for Windows checks text files out with CRLF line ends by default, and the README
      # and LICENSE in the artifacts would then differ from the repository's.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref || github.sha }}
      - run: rustup show
      - run: cargo build --release --locked -p partitur
      - name: Stage the program and its documents
        run: |
          New-Item -ItemType Directory -Path stage | Out-Null
          Copy-Item target\release\partitur.exe, LICENSE, README.md -Destination stage
      - name: The program is self-contained
        # crt-static (.cargo/config.toml) folds the MSVC runtime into the .exe. A dynamically
        # linked one names VCRUNTIME140.dll in its import table, in plain ASCII, and that is
        # the DLL a clean Windows lacks. This runner has the runtime installed, so starting the
        # program here would succeed after a regression too; reading the imports catches it.
        run: |
          $bytes = [IO.File]::ReadAllBytes("stage\partitur.exe")
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if ($text.IndexOf('VCRUNTIME140', [StringComparison]::OrdinalIgnoreCase) -ge 0) {
            throw "partitur.exe links the MSVC runtime dynamically (VCRUNTIME140.dll)"
          }
          Write-Output "stage\partitur.exe: no VCRUNTIME140 import"
      - name: Build the MSI
        # install-wix.ps1 pins the WiX version: this compiler builds an artifact that runs
        # elevated on a user's machine, so a new version must not land unreviewed.
        id: msi
        run: |
          .\scripts\install-wix.ps1
          if ($LASTEXITCODE -ne 0) { throw "install-wix.ps1 exited with status $LASTEXITCODE" }
          .\scripts\build-msi.ps1 -Version $env:VERSION -Stage stage -Output "partitur-$env:VERSION-x86_64-windows.msi"
          if ($LASTEXITCODE -ne 0) { throw "build-msi.ps1 exited with status $LASTEXITCODE" }
      - name: Decide how to sign
        # Signing is switched on by repository variables, so the MSI could ship before SignPath
        # accepted the project. A real release signs with SignPath Foundation's certificate once
        # the organisation is set, and then a failed, rejected or timed-out request fails the job.
        # A dry run takes the same path against the test-signing policy, which needs no approval,
        # so a mistake in the artifact configuration or the checks shows before a tag is pushed.
        # Without the variables the build goes out unsigned, with a warning saying so. This step
        # reads variables only; the API token is handed to the SignPath step alone.
        id: signing
        env:
          IS_RELEASE: ${{ needs.prepare.outputs.is_release }}
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          TEST_POLICY: ${{ vars.SIGNPATH_TEST_SIGNING_POLICY_SLUG }}
          TEST_SIGNER: ${{ vars.SIGNPATH_TEST_SIGNER }}
        run: |
          if ($env:IS_RELEASE -eq 'true' -and $env:ORGANIZATION -ne '') {
            $mode = 'release'; $policy = $env:POLICY; $signer = 'SignPath Foundation'
          } elseif ($env:IS_RELEASE -ne 'true' -and $env:ORGANIZATION -ne '' -and $env:TEST_POLICY -ne '') {
            # The test certificate's subject is whatever SignPath gives it. While the variable
            # is empty the signature check fails and prints the subject it found, which is the
            # value to set.
            $mode = 'test'; $policy = $env:TEST_POLICY; $signer = $env:TEST_SIGNER
          } else {
            $mode = 'none'; $policy = ''; $signer = ''
            Write-Output "::warning::Windows signing is not configured (SIGNPATH_ORGANIZATION_ID or the policy is unset); this build is unsigned"
          }
          # SignPath checks each file's product version against the one the request names, so
          # it is read from the binary: on a dry run VERSION is the bumped version, while the
          # binary, built from the un-bumped commit, still carries the one before it.
          $exeVersion = (Get-Item stage\partitur.exe).VersionInfo.ProductVersion
          if ($mode -ne 'none' -and [string]::IsNullOrEmpty($exeVersion)) {
            throw "stage\partitur.exe carries no product version to sign it under"
          }
          Write-Output "signing: mode $mode, policy '$policy', signer '$signer', product version $exeVersion"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "mode=$mode", "policy=$policy", "signer=$signer", "exe_version=$exeVersion"
      - name: Gather the files to sign
        # The artifact configuration expects the MSI and partitur.exe side by side at the
        # artifact's root. Uploading the MSI and stage\partitur.exe directly would keep the
        # stage\ folder in the artifact, so both are copied into one folder first.
        if: steps.signing.outputs.mode != 'none'
        run: |
          New-Item -ItemType Directory -Path unsigned | Out-Null
          Copy-Item "partitur-$env:VERSION-x86_64-windows.msi", stage\partitur.exe -Destination unsigned
      - name: Upload the unsigned files for SignPath
        # SignPath fetches what it signs from a workflow artifact, so one artifact carries
        # everything one request signs. A re-run of this job uploads it again under the same name.
        if: steps.signing.outputs.mode != 'none'
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-unsigned
          path: unsigned/
          if-no-files-found: error
          overwrite: true
      - name: Sign through SignPath
        # One request signs the MSI, the partitur.exe inside it and the zip's partitur.exe, so a
        # release waits on one manual approval. The wait covers that approval; the job's timeout
        # is raised to match.
        if: steps.signing.outputs.mode != 'none'
        id: sign
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ steps.signing.outputs.policy }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: "${{ steps.signing.outputs.exe_version }}"
      - name: Link the signing request in the job summary
        # Written whether the request succeeded or not, so a rejected or timed-out one can be
        # looked up from the run.
        if: always() && steps.sign.outputs.signing-request-web-url != ''
        env:
          URL: ${{ steps.sign.outputs.signing-request-web-url }}
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Windows signing request: $env:URL"
      - name: Use the signed files
        # The zip is packed after this step, so it takes the signed partitur.exe from the stage.
        if: steps.signing.outputs.mode != 'none'
        run: |
          $msi = "partitur-$env:VERSION-x86_64-windows.msi"
          foreach ($file in "signed\$msi", 'signed\partitur.exe') {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "the signed artifact holds no $file" }
          }
          Copy-Item -LiteralPath "signed\$msi" -Destination $msi -Force
          Copy-Item -LiteralPath signed\partitur.exe -Destination stage\partitur.exe -Force
      - name: Check the signatures
        # A release accepts only SignPath Foundation's certificate, trusted and timestamped. A
        # dry run's test certificate is not one this runner trusts, and the test policy need not
        # timestamp, so there only the signer is checked.
        if: steps.signing.outputs.mode != 'none'
        env:
          MODE: ${{ steps.signing.outputs.mode }}
          SIGNER: ${{ steps.signing.outputs.signer }}
        run: |
          $strict = @{}
          if ($env:MODE -eq 'release') { $strict = @{ RequireTrusted = $true; RequireTimestamp = $true } }
          foreach ($file in "partitur-$env:VERSION-x86_64-windows.msi", 'stage\partitur.exe') {
            & .\scripts\check-signature.ps1 -Path $file -Signer "$env:SIGNER" @strict
            if ($LASTEXITCODE -ne 0) { throw "the signature of $file failed its check" }
          }
      - name: Zip
        run: |
          7z a "partitur-$env:VERSION-x86_64-windows.zip" .\stage\*
          if ($LASTEXITCODE -ne 0) { throw "7z exited with status $LASTEXITCODE" }
      - name: Install silently and check the entry and the shortcut
        # msiexec writes its log in UTF-16, which the job's log would show as spaced-out
        # characters, so a failed install prints it decoded to make the run diagnosable; pwsh
        # finds the encoding from the file's byte order mark. When the build was signed, the
        # installed partitur.exe is checked as the staged one was: that proves the copy inside
        # the MSI was signed too, which no check on the MSI itself shows.
        env:
          MODE: ${{ steps.signing.outputs.mode }}
          SIGNER: ${{ steps.signing.outputs.signer }}
        run: |
          Import-Module .\scripts\windows-install.psm1
          $log = Join-Path $env:RUNNER_TEMP 'partitur-install.log'
          $code = Install-PartiturMsi -Path ".\partitur-$env:VERSION-x86_64-windows.msi" -Log $log
          if ($code -ne 0 -and $code -ne 3010) {
            if (Test-Path $log) { Get-Content -Path $log }
            throw "msiexec exited with status $code"
          }
          Assert-PartiturInstalled -Version $env:VERSION
          Get-PartiturEntry | Format-List
          if ($env:MODE -ne 'none') {
            $strict = @{}
            if ($env:MODE -eq 'release') { $strict = @{ RequireTrusted = $true; RequireTimestamp = $true } }
            & .\scripts\check-signature.ps1 -Path "$env:ProgramFiles\Partitur\partitur.exe" -Signer "$env:SIGNER" @strict
            if ($LASTEXITCODE -ne 0) { throw "the signature of the installed partitur.exe failed its check" }
          }
      - name: Smoke the installed program
        env:
          EXPECTED: ${{ needs.prepare.outputs.is_release == 'true' && needs.prepare.outputs.version || '' }}
        run: |
          & .\scripts\smoke-windows.ps1 "$env:ProgramFiles\Partitur\partitur.exe" "$env:EXPECTED"
          if ($LASTEXITCODE -ne 0) { throw "the installed program failed its smoke" }
      - name: Check the zip's contents and its program's version
        # The window was proven on the installed copy of the same build; this proves the zip
        # holds the three files and a program that starts.
        env:
          EXPECTED: ${{ needs.prepare.outputs.is_release == 'true' && needs.prepare.outputs.version || '' }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'partitur-zip'
          Expand-Archive -Path "partitur-$env:VERSION-x86_64-windows.zip" -DestinationPath $dir
          $names = (Get-ChildItem -LiteralPath $dir | Sort-Object Name | ForEach-Object Name) -join ','
          if ($names -ne 'LICENSE,partitur.exe,README.md') { throw "the zip holds '$names', expected LICENSE, partitur.exe and README.md" }
          & .\scripts\smoke-windows.ps1 "$dir\partitur.exe" "$env:EXPECTED" -VersionOnly
          if ($LASTEXITCODE -ne 0) { throw "the zip's program failed its --version check" }
      - name: Uninstall and check it is all gone
        # The uninstall is the one Settings > Apps runs: msiexec /x on the product code read
        # back from the entry, not rebuilt here.
        run: |
          Import-Module .\scripts\windows-install.psm1
          $log = Join-Path $env:RUNNER_TEMP 'partitur-uninstall.log'
          $code = Uninstall-PartiturMsi -Log $log
          if ($code -ne 0 -and $code -ne 3010) {
            if (Test-Path $log) { Get-Content -Path $log }
            throw "msiexec /x exited with status $code"
          }
          Assert-PartiturRemoved
          if (Test-Path "$env:ProgramFiles\Partitur") { throw "the uninstall left $env:ProgramFiles\Partitur behind" }
          Write-Output "uninstalled: the folder, the entry and the shortcut are gone"
      - name: Upload
        if: needs.prepare.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$env:VERSION" `
            "partitur-$env:VERSION-x86_64-windows.zip" `
            "partitur-$env:VERSION-x86_64-windows.msi" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload exited with status $LASTEXITCODE" }
      - if: needs.prepare.outputs.is_release != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: |
            partitur-*-x86_64-windows.zip
            partitur-*-x86_64-windows.msi

  checksums:
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, deb, arch, appimage, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hashing what the release actually holds, rather than what each build job
      # believed it uploaded, is what makes this file describe the release.
      - name: Download every release asset and hash it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir dl && cd dl
          gh release download "v$VERSION" --repo "${GITHUB_REPOSITORY}"
          # SHA256SUMS is itself an asset of the release it describes, so a re-run of
          # this job downloads the previous one alongside the packages. Remove it before
          # hashing, or it ends up in its own successor with a hash of its old contents.
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          gh release upload "v$VERSION" SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber

  publish:
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, checksums]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false --repo "${GITHUB_REPOSITORY}"
